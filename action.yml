name: LaunchRig config validation
description: Validate a LaunchRig v1 configuration without ADB, a phone, or wallet access.
inputs:
  config:
    description: Relative config path inside the working directory.
    required: false
    default: launchrig.yml
  working-directory:
    description: Relative project directory inside GITHUB_WORKSPACE.
    required: false
    default: .
  output:
    description: Relative JSON result path beneath .launchrig in the working directory.
    required: false
    default: .launchrig/validation.json
outputs:
  valid:
    description: true only when LaunchRig accepts the configuration and its referenced files.
    value: ${{ steps.validate.outputs.valid }}
  scenario-count:
    description: Validated scenario count, or an empty value when structured validation could not run.
    value: ${{ steps.validate.outputs.scenario-count }}
  result-file:
    description: Workspace-relative path to the normalized JSON result.
    value: ${{ steps.validate.outputs.result-file }}
runs:
  using: composite
  steps:
    - id: validate
      name: Validate LaunchRig configuration
      shell: bash
      env:
        LAUNCHRIG_ACTION_CONFIG: ${{ inputs.config }}
        LAUNCHRIG_ACTION_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        LAUNCHRIG_ACTION_OUTPUT: ${{ inputs.output }}
      run: node "$GITHUB_ACTION_PATH/action/run-validation.mjs"
branding:
  icon: check-circle
  color: purple
