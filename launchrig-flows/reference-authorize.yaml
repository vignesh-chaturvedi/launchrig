appId: com.solana.mobilewalletadapter.fakedapp
name: Reference MWA authorize
---
- launchApp:
    stopApp: true
    clearState: false
- extendedWaitUntil:
    visible: "GET CAPABILITIES"
    timeout: 15000
- tapOn:
    text: "^AUTHORIZE$"
- extendedWaitUntil:
    visible: "AUTHORIZE DAPP"
    timeout: 30000
- tapOn:
    text: "^AUTHORIZE$"
- extendedWaitUntil:
    visible: "MWA 2.0"
    timeout: 30000
- assertVisible: "REAUTHORIZE"
- assertVisible:
    id: "com.solana.mobilewalletadapter.fakedapp:id/cb_has_auth_token"
    checked: true
- assertVisible:
    id: "com.solana.mobilewalletadapter.fakedapp:id/btn_sign_msg_x1"
    enabled: true
