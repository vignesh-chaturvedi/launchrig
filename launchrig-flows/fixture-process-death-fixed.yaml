appId: dev.launchrig.fixture
name: Controlled process-death recovery
---
- openLink:
    link: "launchrig://fixture/process-death?variant=fixed"
- extendedWaitUntil:
    visible:
      id: "fixture-ready"
      text: "^(READY|REPAIR_REQUIRED)$"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "fixture-variant"
      text: "^fixed$"
    timeout: 15000
- assertVisible:
    id: "fixture-scenario"
    text: "^process-death$"
- tapOn:
    id: "reset-process-death-fixture"
- extendedWaitUntil:
    visible:
      id: "fixture-ready"
      text: "^READY$"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "process-death-state"
      text: "^IDLE$"
    timeout: 15000
- runFlow:
    when:
      visible: "^Connect wallet$"
    commands:
      - tapOn:
          id: "connect-wallet"
      - tapOn:
          text: "^Mock MWA Wallet$"
          optional: true
      - tapOn:
          text: "^Just once$"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "com.solana.mwallet:id/btn_connect"
          timeout: 30000
      - tapOn:
          id: "com.solana.mwallet:id/btn_connect"
- extendedWaitUntil:
    visible:
      id: "wallet-state"
      text: "^CONNECTED$"
    timeout: 30000
- tapOn:
    id: "request-process-death"
- tapOn:
    text: "^Mock MWA Wallet$"
    optional: true
- tapOn:
    text: "^Just once$"
    optional: true
- runFlow:
    when:
      visible:
        id: "com.solana.mwallet:id/btn_connect"
    commands:
      - tapOn:
          id: "com.solana.mwallet:id/btn_connect"
- extendedWaitUntil:
    visible:
      id: "com.solana.mwallet:id/btn_cancel"
    timeout: 30000
- assertVisible:
    id: "com.solana.mwallet:id/text_subtitle"
    text: "^Sign message\\(s\\)$"
- stopApp: dev.launchrig.fixture
- tapOn:
    id: "com.solana.mwallet:id/btn_cancel"
    optional: true
- openLink:
    link: "launchrig://fixture/process-death?variant=fixed"
- extendedWaitUntil:
    visible:
      id: "fixture-ready"
      text: "^READY$"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "process-instance-changed"
      text: "^true$"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "process-death-state"
      text: "^RECOVERED_UNKNOWN$"
    timeout: 30000
- assertVisible:
    id: "request-outcome"
    text: "^UNKNOWN$"
- assertVisible:
    id: "request-pending"
    text: "^false$"
- assertVisible:
    id: "request-action-enabled"
    text: "^true$"
- assertVisible:
    id: "request-process-death"
    enabled: true
