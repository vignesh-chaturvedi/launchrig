name: LaunchRig CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.11.0, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm fixtures:fetch
      - name: Exercise the local validation Action source
        uses: ./
        with:
          config: launchrig.yml
      - run: pnpm run package:smoke
      - run: node dist/src/cli.js validate --config launchrig.yml

  fixture-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fixture-dapp
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/fixture-dapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run test
      - run: pnpm run lint:check
      - run: pnpm run format:check

  # Full `run` belongs on a later self-hosted runner physically attached to Android.
  # A GitHub-hosted runner cannot access the developer's USB phone.
